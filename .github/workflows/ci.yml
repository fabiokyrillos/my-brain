name: verify
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pre-existing application gate. Every Vitest suite mocks Supabase, so
  # this job proves the Node layer only — the `worker` and `database` jobs
  # below cover what it cannot reach.
  app:
    name: application (lint, types, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key-with-enough-length
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # supabase/functions/** is invisible to both other gates: eslint.config.mjs
  # ignores it and vitest.config.ts only includes src/**. This job is the only
  # static or behavioural check the production worker gets.
  worker:
    name: edge worker (deno types, deno tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      # Every Deno command is scoped to a function's own deno.json. Without
      # --config, Deno discovers the repository root's package.json, adopts the
      # entire Next.js dependency tree as its own manifest, and then fails
      # because it expects a populated node_modules/ it has no reason to need.
      # --node-modules-dir=none resolves npm: specifiers from Deno's global
      # cache and writes no node_modules/ next to a function — `auto` does write
      # one, which would end up inside the deployed bundle.
      #
      # --no-lock is a deliberate trade-off, not hermeticity: Deno never reads
      # package-lock.json, so `npm:@supabase/supabase-js@2` floats within major
      # 2 here. That is exactly how the DEPLOYED function resolves it, so this
      # gate sees what production sees — a 2.x that breaks the worker reds this
      # job before it reaches a deploy. The cost is that a provider release can
      # red the job with no repository change. A committed Deno lockfile is not
      # the alternative: it would have to live beside a function's deno.json,
      # where `supabase functions deploy` would bundle it.
      - name: Type-check the deployed function entrypoints
        run: |
          deno check --config supabase/functions/process-jobs/deno.json --node-modules-dir=none --no-lock \
            supabase/functions/process-jobs/index.ts
          deno check --config supabase/functions/heartbeat/deno.json --node-modules-dir=none --no-lock \
            supabase/functions/heartbeat/index.ts
          deno check --config supabase/functions/delete-account/deno.json --node-modules-dir=none --no-lock \
            supabase/functions/delete-account/index.ts

      - name: Run the worker test suite
        # No --allow-* flags on purpose: the suite must stay network-free and
        # must never reach a real OpenAI or Supabase endpoint.
        #
        # Paths are enumerated from the directory listing rather than passing
        # `supabase/functions/` once: a scoped --config narrows Deno's own test
        # discovery to that config's directory, which would silently drop the
        # _shared suites. Globbing every function directory means a new one is
        # covered automatically instead of being missed.
        run: |
          set -euo pipefail
          DIRS=$(ls -d supabase/functions/*/)
          echo "Discovering tests in: $DIRS"
          deno test --config supabase/functions/process-jobs/deno.json --node-modules-dir=none --no-lock $DIRS

      - name: Re-execute the BYOK crypto interop proof (gate G-0.2, gate A3)
        # BYOK.1 acceptance gate A3 requires the cross-runtime round trip to be
        # *executed* in CI, not asserted. It lives in this job rather than in
        # `application` because it is the only job with a Deno runtime, and the
        # script needs both: it encrypts in Node and decrypts in Deno, then
        # reverses the direction. Node is preinstalled on the runner and the
        # script imports nothing outside `node:` builtins, so no `npm ci` is
        # needed here.
        #
        # The master key is generated in memory for the run and reaches the Deno
        # child through an environment variable scoped to that process. Nothing
        # is written to disk, nothing is printed, and no repository secret is
        # involved — which is why this can run on a fork PR.
        #
        # `src/lib/byok/parity.test.ts` in the `application` job is the cheap
        # half of the same guarantee: it catches the edit, this catches the
        # divergence.
        run: node scripts/byok-crypto-interop.mjs

  # The database is this product's trust boundary and its largest body of
  # logic. Nothing verified it automatically before this job: pgTAP had never
  # run as a suite in any environment, and no check proved the migration chain
  # still applies to an empty database.
  database:
    name: database and journey (migrations, pgTAP, db lint, foundation e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0

      - name: Start the local Supabase stack
        # Studio, image proxy, mail catcher, log pipeline and the edge runtime
        # are not exercised by any gate below, so they are excluded to keep the
        # job inside its timeout. `db`, `kong`, `rest`, `meta` and Auth stay up
        # because the journey step needs a real API and a real Auth service.
        # `inbucket`, `analytics` and `functions` appear in `supabase start
        # --help` but the CLI rejects them at runtime ("not valid to exclude"),
        # so only the names it actually accepts are listed. `vector` is left
        # running on purpose even though no gate reads logs: `[analytics]` is
        # enabled in config.toml and cannot be excluded, and it consumes the
        # vector pipeline — a few seconds of start-up is cheaper than a
        # half-configured log path.
        run: supabase start -x studio,imgproxy,edge-runtime

      - name: Apply the whole migration chain to an empty database
        # Proves every migration still applies from zero, in order — the check
        # `supabase db push` against an already-migrated project cannot make.
        # Also runs supabase/seed.sql, which installs pgTAP for the next step.
        run: supabase db reset

      # POSTURE: post-revocation. Everything from `db reset` through the
      # Playwright step below runs against the privilege posture the migration
      # chain actually produces — since `202607300063`, that means `authenticated`
      # holds SELECT only on `public.tasks`, and SELECT + INSERT on
      # `public.reminders`. `supabase/tests/phase_2f_task_write_grants.sql` is the
      # file that asserts it, and the ten re-dispositioned statements in
      # `phase_2e_task_command_apply.sql` / `phase_2e_task_command_creation.sql`
      # depend on it.
      #
      # The re-grant rehearsal at the END of this job is the only step that runs
      # under any other posture, and it restores this one before it finishes.
      # Nothing between here and there sees a re-granted database.
      - name: Run the pgTAP suite (post-revocation posture)
        run: supabase test db --local supabase/tests

      - name: Lint the database
        # `--level warning` prints everything; `--fail-on error` gates. The two
        # long-standing 42804 warnings in run_user_heartbeat are recorded in
        # docs/SECURITY.md and are not part of this initiative — error level is
        # what catches the defect class this gate exists for (the
        # `pg_catalog.greatest` lookup that 202607220042/045 had to fix twice).
        #
        # Scoped to the product's own schemas. Without --schema the linter also
        # walks `extensions`, where supabase/seed.sql installed pgTAP: its 30
        # internal plpgsql_check findings (7 of them error level) would fail a
        # gate that exists to check code this project owns. `private` is
        # included deliberately — the undo handlers and the AI bounds validator
        # live there.
        run: supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Export the local Supabase credentials
        # NEXT_PUBLIC_* are inlined at build time, so this must precede build.
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          if [ -z "${API_URL:-}" ]; then
            echo "supabase status did not report API_URL" >&2
            exit 1
          fi
          BROWSER_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          if [ -z "$BROWSER_KEY" ]; then
            echo "supabase status did not report ANON_KEY or PUBLISHABLE_KEY" >&2
            exit 1
          fi
          ADMIN_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$ADMIN_KEY" ]; then
            echo "supabase status did not report SERVICE_ROLE_KEY or SECRET_KEY" >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$BROWSER_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$BROWSER_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$ADMIN_KEY" >> "$GITHUB_ENV"
          # The re-grant rehearsal needs a direct owner connection: it issues
          # GRANT/REVOKE, which no API key can do. `supabase status` reports
          # DB_URL for the local stack; the fallback is the port config.toml
          # pins (54322), so a CLI that stops reporting it fails loudly on the
          # rehearsal rather than silently skipping it.
          echo "LOCAL_DB_URL=${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}" >> "$GITHUB_ENV"

      - name: Prove same-key standalone creation with two database sessions
        run: npm run test:local:2e:creation-race

      - name: Prove the deletion reaper claims each stuck account exactly once
        # 2H-RECOVER-001/003. The pgTAP suite cannot prove this: it runs in one
        # session and one transaction, so two "concurrent" claims would
        # serialise and the assertion would agree with itself. This step opens
        # six real PostgREST connections against eight stuck accounts, each
        # racer permitted to take all eight, and fails if any account is handed
        # to two reapers — which would mean two executors deleting one account.
        #
        # It creates and removes disposable accounts, and verifies the removal
        # rather than assuming it. Local stack only, deliberately: a hosted run
        # would put disposable users in the production auth table to prove a
        # property that is identical here.
        run: npm run test:local:2h1:reaper-race

      - name: Prove the rate limiter admits exactly its ceiling under concurrency
        # 2H-RATE-004. The pgTAP suite proves the ceiling, the rolling window,
        # the recorded refusal and the fail-closed branch, but it runs in one
        # session and one transaction — N "concurrent" claims there would
        # serialise and agree with themselves. This step opens 80 real
        # connections against a ceiling of 60 through the worker door, and 30
        # against a ceiling of 20 through real authenticated sessions, and fails
        # if either admits one more than its signed ceiling.
        #
        # It reads the STORED admitted-row count over LOCAL_DB_URL rather than
        # counting successful replies: the reply proves what the limiter said,
        # and the requirement is about what it stored. Two disposable accounts
        # per lane, removed and verified removed.
        run: npm run test:local:2h3:rate-race

      - name: Build the application under test
        run: npm run build

      - name: Install the browser
        # Both Playwright projects (Desktop Chrome, Pixel 7) are Chromium.
        run: npx playwright install --with-deps chromium

      - name: Run the deterministic foundation journey
        # foundation.spec.ts needs no OpenAI key and no seeded user: it proves
        # the proxy's auth boundary, the locale redirects and the accessible
        # auth forms. task-command.spec.ts is credential-free for the same
        # reason and proves Slice 2E.7's new nested route joins both contracts.
        # The remaining specs are credential-gated against the linked project
        # and skip themselves; remote smokes stay manual.
        run: npx playwright test e2e/foundation.spec.ts e2e/task-command.spec.ts --project=desktop --project=mobile

      # 2F-REVOKE-003 — the re-grant rollback rehearsal.
      #
      # WHY IT IS LAST. Every step above must see the posture the migration chain
      # produces. This step is the only one that changes that posture, so it runs
      # after all of them and restores the posture before it exits. Three
      # explicit boundaries make the "which assertions ran under which posture"
      # question unambiguous rather than a matter of reading step order:
      #
      #   A. it FAILS if the stack is not in the post-revocation posture when it
      #      starts, so it can never be the thing that made an earlier step pass;
      #   B. it runs its own pgTAP directory — `supabase/regrant-rehearsal/`,
      #      deliberately NOT `supabase/tests/` — so the normal suite can never
      #      be executed under the re-granted posture, by ordering accident or
      #      otherwise;
      #   C. it re-applies the revocation and re-asserts the denial before
      #      finishing, so the job never ends on a widened database.
      #
      # WHAT IT PROVES: the committed rollback SQL applies and restores the
      # versioned migration-chain privileges, such that writes refused by the
      # normal suite succeed again.
      #
      # WHAT IT DOES NOT PROVE, and may not be cited as proving: live PostgREST
      # schema-cache convergence, in-flight session behaviour, or an operational
      # rollback against production. Those are observable only against a live
      # project and are verified in the 2F.4 deployment session. "Rehearsed in
      # CI" is truthful only with this scope attached.
      - name: Rehearse the re-grant rollback (SQL-level only; not a live-ops rehearsal)
        run: |
          set -euo pipefail
          echo "::group::A. Confirm the starting posture is post-revocation"
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if pg_catalog.has_table_privilege('authenticated', 'public.tasks', 'update') then
                raise exception 'rehearsal precondition failed: the stack is already re-granted, so every step above ran under the wrong posture';
              end if;
            end
            \$\$;"
          echo "starting posture confirmed: authenticated cannot write public.tasks"
          echo "::endgroup::"

          echo "::group::B. Apply the committed re-grant and prove the writes return"
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f scripts/phase-2f-regrant-task-write-grants.sql
          supabase test db --local supabase/regrant-rehearsal
          echo "::endgroup::"

          echo "::group::C. Restore the post-revocation posture before leaving"
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -c "
            revoke insert, update, delete on public.tasks from authenticated;
            revoke update, delete on public.reminders from authenticated;
            do \$\$
            begin
              if pg_catalog.has_table_privilege('authenticated', 'public.tasks', 'update') then
                raise exception 'rehearsal failed to restore the post-revocation posture';
              end if;
              if not pg_catalog.has_table_privilege('authenticated', 'public.reminders', 'insert') then
                raise exception 'rehearsal disturbed the retained Option C reminder INSERT grant';
              end if;
            end
            \$\$;"
          echo "posture restored: revoked again, Option C reminder INSERT intact"
          echo "::endgroup::"

      - name: Collect the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect the Supabase container logs
        if: failure()
        # `|| true` because the default shell is `bash -e -o pipefail`: with no
        # matching container `grep` exits 1 and would red this step on top of the
        # real failure it is trying to explain.
        run: docker ps -a --format '{{.Names}}' | grep -i supabase | xargs -r -I{} sh -c 'echo "===== {} ====="; docker logs --tail 200 {} 2>&1' || true

      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup
